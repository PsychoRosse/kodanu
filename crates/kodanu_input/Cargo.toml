[package]
name = "kodanu_input"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

description = "None"
keywords = ["game-engine", "gamedev", "input"]
categories = ["game-development"]

[lib]
path = "src/_lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[dependencies]
kodanu_math = { workspace = true }
kodanu_ecs = { workspace = true }
kodanu_window = { workspace = true }
kodanu_macros = { workspace = true }
kodanu_time = { workspace = true }

serde = { workspace = true, features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
