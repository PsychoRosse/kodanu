[package]
name = "kodanu_plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

description = "Development and demo plugins for the Kodanu game engine."
keywords = ["game-engine", "gamedev", "plugins"]
categories = ["game-development"]

[lib]
path = "src/_lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[dependencies]
kodanu_ecs = { workspace = true}
kodanu_math = { workspace = true }
kodanu_transform = { workspace = true }
kodanu_graphics = { workspace = true }
kodanu_input = { workspace = true }
kodanu_physics = { workspace = true }
kodanu_camera = { workspace = true }
kodanu_time = { workspace = true }
kodanu_window = { workspace = true }
