[package]
name = "kodanu_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

description = "Application entry point for the Kodanu game engine."
keywords = ["game-engine", "gamedev", "app", "window"]
categories = ["game-development"]

[lib]
path = "src/_lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[dependencies]
pollster = { workspace = true }

kodanu_window = { workspace = true }
kodanu_ecs = { workspace = true }
kodanu_time = { workspace = true }
kodanu_math = { workspace = true }
kodanu_graphics = { workspace = true }
